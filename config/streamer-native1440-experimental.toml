# EXPERIMENTAL: driver/EDID/native 2560x1440 support has NOT been verified.
device = "/dev/video0"
native = "/opt/t6-kvm/current/bin/t6-capture"
http_socket = "/run/t6-kvm/streamer.sock"
frame_socket = "/run/t6-kvm/frames.sock"
fps = 60
bitrate_kbps = 20000
gop = 60
max_width = 2560
max_height = 1440
expected_width = 2560
expected_height = 1440
queue_frames = 3
stall_seconds = 8.0
policy = "takeover" # or "reject"; authenticated controller only
input_mode = "native"
copy_mode = "copy"
