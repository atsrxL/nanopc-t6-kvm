name: Import verified T6 source package
'on':
  push:
    branches: [main]
    paths: [.t6-import/READY]
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify and import the original 64 files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYIMPORT'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request
          import zlib
          
          REPO = "atsrxL/nanopc-t6-kvm"
          EXPECTED_TREE = "6d0e8748c93f012470672feefac51efd91a1442e"
          PAYLOAD_SHA256 = "707bee0734d3fcfcbba0ca655ee155022159144a1eb48525dc447f01aa431c07"
          ARCHIVE_SHA256 = "0935d53f8ac41e6fcdca3d84ee8336dcc00fc835cd1b780b77d577e048d8e8af"
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          HEAD = os.environ["GITHUB_SHA"]
          BASE = "https://api.github.com/repos/" + REPO
          
          def request(url, method="GET", value=None, authenticated=True):
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "t6-source-import", "X-GitHub-Api-Version": "2022-11-28"}
              if authenticated:
                  assert url.startswith(BASE + "/")
                  headers["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]
              body = None if value is None else json.dumps(value, ensure_ascii=False).encode("utf-8")
              if body is not None:
                  headers["Content-Type"] = "application/json"
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, data=body, headers=headers, method=method)
                      with urllib.request.urlopen(req, timeout=60) as response:
                          raw = response.read(4 * 1024 * 1024 + 1)
                          assert len(raw) <= 4 * 1024 * 1024
                          return json.loads(raw)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 502, 503, 504) or attempt == 3:
                          raise RuntimeError(f"GitHub {method} failed with HTTP {error.code}") from None
                      time.sleep(2 ** attempt)
          
          assert request(BASE + "/git/ref/heads/main")["object"]["sha"] == HEAD, "main moved; refusing to overwrite"
          encoded = []
          for index in range(9):
              item = request(BASE + f"/contents/.t6-import/part-{index:02d}.b64?ref=" + HEAD)
              assert item["encoding"] == "base64"
              encoded.append(base64.b64decode(item["content"]).decode("ascii").strip())
          compressed = base64.b64decode("".join(encoded), validate=True)
          assert len(compressed) == 75788
          assert hashlib.sha256(compressed).hexdigest() == PAYLOAD_SHA256, "transfer checksum mismatch"
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=235472)
          assert decoder.eof and not decoder.unused_data and len(raw) == 235471
          payload = json.loads(raw)
          files = {path: text.encode("utf-8") for path, text in payload["files"].items()}
          archive = bytearray()
          license_bytes = None
          for part in payload["archive_parts"]:
              if "literal" in part:
                  archive.extend(base64.b64decode(part["literal"], validate=True))
                  continue
              url = part["url"]
              assert url.startswith(("https://api.github.com/repos/pikvm/kvmd/git/blobs/", "https://api.github.com/repos/armbian/linux-rockchip/git/blobs/"))
              result = request(url, authenticated=False)
              assert result["encoding"] == "base64"
              data = base64.b64decode(result["content"])
              assert hashlib.sha256(data).hexdigest() == part["sha256"], "upstream content changed"
              encoder = zlib.compressobj(6, zlib.DEFLATED, -15)
              encoded_part = encoder.compress(data) + encoder.flush()
              assert hashlib.sha256(encoded_part).hexdigest() == part["compressed_sha256"], "ZIP deflate mismatch"
              archive.extend(encoded_part)
              if part["sha256"] == "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903":
                  license_bytes = data
          assert len(archive) == 69947 and hashlib.sha256(archive).hexdigest() == ARCHIVE_SHA256
          assert license_bytes is not None
          files["LICENSE"] = license_bytes
          files["reference/original-handoff.zip"] = bytes(archive)
          manifest = payload["manifest"]
          assert len(files) == len(manifest) == 64
          assert set(files) == {item["path"] for item in manifest}
          for item in manifest:
              path = pathlib.PurePosixPath(item["path"])
              assert not path.is_absolute() and ".." not in path.parts and ".git" not in path.parts
              assert item["mode"] in ("100644", "100755")
              data = files[item["path"]]
              assert len(data) == item["bytes"]
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert actual == item["sha"], "file mismatch: " + item["path"]
          for line in files["SOURCE-SHA256SUMS"].decode().splitlines():
              expected, path = line.split("  ", 1)
              assert hashlib.sha256(files[path]).hexdigest() == expected, path
          blob = request(BASE + "/git/blobs", "POST", {"encoding": "base64", "content": base64.b64encode(archive).decode("ascii")})
          elements = []
          for item in manifest:
              entry = {key: item[key] for key in ("path", "mode", "type")}
              if item["path"] == "reference/original-handoff.zip":
                  assert blob["sha"] == item["sha"]
                  entry["sha"] = blob["sha"]
              else:
                  entry["content"] = files[item["path"]].decode("utf-8")
              elements.append(entry)
          tree = request(BASE + "/git/trees", "POST", {"tree": elements})
          assert tree["sha"] == EXPECTED_TREE, "complete Git tree mismatch; refusing publication"
          assert request(BASE + "/git/ref/heads/main")["object"]["sha"] == HEAD, "main moved; refusing to overwrite"
          commit = request(BASE + "/git/commits", "POST", {"message": "feat: import T6 KVM 0.1.0 source and handoff\n\nImport the 64-file development source package byte-for-byte.\nPreserve executable modes, original handoff archive and validation logs.\nSource ZIP SHA256: 992580f5ded5545b4f6461d73c4a7cc96040e629d6ab1f9c1fa0790a08aef924\nNo hardware validation or deployment performed.\nRemove temporary import workflow and payload from the final tree.", "tree": tree["sha"], "parents": [HEAD]})
          request(BASE + "/git/refs/heads/main", "PATCH", {"sha": commit["sha"], "force": False})
          confirmed = request(BASE + "/git/ref/heads/main")["object"]["sha"]
          assert confirmed == commit["sha"]
          print("Imported and verified 64 files with original bytes and executable modes.")
          print("Commit:", confirmed)
          print("Tree:", tree["sha"])
          print("Temporary import workflow and payload are absent from the final tree.")
          PYIMPORT
